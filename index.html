<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Ofertas - Achadinhos</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f3f4f6; color: #333; }
        
        /* Cabeçalho Fixo com Banner */
        header { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            background: #000;
            color: white; 
            padding: 6px; 
            text-align: center; 
            z-index: 1000; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }

        .banner-container {
            position: relative;
            width: 100%;
            height: 135px;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .banner-topo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.65);
        }

        .banner-conteudo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 5px;
            box-sizing: border-box;
        }
        
        /* Título Maior e Destacado */
        header h2 { 
            margin: 0 0 6px 0; 
            font-size: 21px; 
            font-weight: 900; 
            text-shadow: 2px 2px 6px rgba(0,0,0,0.95);
            letter-spacing: 0.8px;
            text-align: center;
        }
        
        /* Área de Login / Cadastro */
        .header-auth {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            width: 100%;
        }
        .header-auth input {
            padding: 5px 8px;
            font-size: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 105px;
            background: rgba(255, 255, 255, 0.95);
        }
        .header-auth button {
            padding: 5px 10px;
            font-size: 11px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .header-auth button:hover { background: #059669; }
        .btn-sair-topo { background: #dc2626 !important; }
        .btn-sair-topo:hover { background: #b91c1c !important; }
        
        .link-topo { color: #fff; font-size: 11px; text-decoration: underline; cursor: pointer; margin-left: 4px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

        .container { padding: 155px 15px 20px 15px; max-width: 600px; margin: auto; }

        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .produto-card { text-align: left; position: relative; }
        .produto-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .produto-titulo { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .produto-preco { color: #16a34a; font-size: 20px; font-weight: bold; margin-bottom: 4px; }
        
        .timer-oferta {
            display: inline-block;
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input[type="text"], input[type="file"] { 
            width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; font-size: 14px; background: #fff; 
        }
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-bottom: 5px; }
        
        button.btn-principal { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 5px; }
        button.btn-principal:hover { background: #1d4ed8; }
        .btn-apagar { background: #dc2626; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-apagar:hover { background: #b91c1c; }
        
        /* Sistema de Alerta Profissional (Toast Flutuante) */
        #toast-aviso {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #0f172a;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            z-index: 3000;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            border-left: 5px solid #10b981;
            transition: transform 0.3s ease-in-out;
            max-width: 90%;
        }
        #toast-aviso.mostrar {
            transform: translateX(-50%) translateY(0);
        }

        /* Modal de Confirmação Profissional (Substitui o confirm() nativo) */
        #modal-confirmacao {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3500;
        }
        .modal-caixa {
            background: white;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .modal-caixa p { font-size: 15px; font-weight: bold; margin-bottom: 20px; color: #1e293b; }
        .modal-botoes { display: flex; gap: 10px; justify-content: center; }
        .modal-botoes button { padding: 10px 18px; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; width: 50%; }
        .btn-modal-sim { background: #dc2626; color: white; }
        .btn-modal-nao { background: #e2e8f0; color: #334155; }

        /* Popups Flutuantes */
        #popup-notif {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 14px 20px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 2000; display: none; max-width: 90%; text-align: center; border: 2px solid #38bdf8;
        }
        #popup-notif button { background: #10b981; color: white; border: none; padding: 8px 14px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 13px; }

        #popup-instalar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #0f172a; color: white; padding: 16px 20px; border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5); z-index: 2000; display: none; max-width: 90%; text-align: center; border: 2px solid #10b981;
        }
        #popup-instalar button { background: #2563eb; color: white; border: none; padding: 9px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; }

        .stats { font-size: 14px; color: #666; margin-top: 10px; text-align: center; }
        .escondido { display: none; }
    </style>
</head>
<body>

    <!-- Notificação Toast Profissional -->
    <div id="toast-aviso">Mensagem do Sistema</div>

    <!-- Modal de Confirmação Personalizado -->
    <div id="modal-confirmacao">
        <div class="modal-caixa">
            <p id="modal-texto-pergunta">Tem certeza?</p>
            <div class="modal-botoes">
                <button class="btn-modal-nao" onclick="fecharModalConfirmacao(false)">Cancelar</button>
                <button class="btn-modal-sim" id="btn-modal-sim-acao">Sim</button>
            </div>
        </div>
    </div>

    <!-- Popup Flutuante de Instalação do App -->
    <div id="popup-instalar">
        <p style="margin: 0; font-size: 14px; font-weight: bold;">📱 Baixe nosso APP e receba ofertas todos os dias!</p>
        <button id="btn-instalar-app">Instalar Aplicativo Agora</button>
        <span style="display:block; margin-top:8px; font-size:11px; text-decoration:underline; cursor:pointer; opacity:0.8;" onclick="fecharPopupInstalar()">Agora não</span>
    </div>

    <!-- Popup Flutuante de Notificação -->
    <div id="popup-notif">
        <p style="margin: 0; font-size: 13px; font-weight: bold;">🔔 Deseja ativar os alertas para receber achadinhos no celular?</p>
        <button onclick="ativarNotificacoes(); fecharPopupNotif();">Sim, Ativar Agora!</button>
        <span style="display:block; margin-top:6px; font-size:11px; text-decoration:underline; cursor:pointer; opacity:0.8;" onclick="fecharPopupNotif()">Fechar</span>
    </div>

    <!-- Cabeçalho Fixo com Banner -->
    <header>
        <div class="banner-container">
            <img src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?auto=format&fit=crop&w=1200&q=80" alt="Banner Ofertas" class="banner-topo">
            <div class="banner-conteudo">
                <h2>🔥 SUPER OFERTAS & ACHADINHOS</h2>
                
                <div class="header-auth" id="bloco-auth-topo">
                    <input type="email" id="auth-email" placeholder="E-mail">
                    <input type="password" id="auth-senha" placeholder="Senha">
                    <button id="btn-acao-auth" onclick="realizarLogin()">Entrar</button>
                    <button style="background: #0284c7;" onclick="criarConta()">Cadastrar</button>
                    <span class="link-topo" onclick="esqueciSenha()">Esqueci</span>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        
        <!-- PAINEL DE ADMINISTRAÇÃO -->
        <div id="painel-admin" class="card escondido" style="border: 2px dashed #2563eb;">
            <h3 style="color: #2563eb; margin-top: 0;">🔒 Painel do Administrador</h3>
            <p id="info-admin" style="font-size: 12px; color: #666;"></p>
            
            <label>Selecione a foto do produto:</label>
            <input type="file" id="input-arquivo" accept="image/*">

            <label>Nome do produto:</label>
            <input type="text" id="input-titulo" placeholder="Ex: Óculos de Sol Esportivo">

            <label>Preço:</label>
            <input type="text" id="input-preco" placeholder="Ex: 39,90">

            <label>Link de afiliado:</label>
            <input type="text" id="input-link" placeholder="Cole o link da Shopee ou Mercado Livre">

            <button class="btn-principal" style="background: #10b981;" onclick="cadastrarComFoto()">✨ Publicar na Vitrine</button>
        </div>

        <!-- Vitrine de Produtos -->
        <div id="lista-produtos">
            <p style="text-align: center; color: #666;">Carregando ofertas...</p>
        </div>

        <div class="card stats">
            Cliques totais no app: <span id="contador-cliques">0</span>
        </div>
    </div>

    <!-- Script do Firebase, PWA e Alertas Modernos -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, updateDoc, deleteDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC75L1-BhKHuwAf21o2ORV6UMHK0JVvcmQ",
          authDomain: "minhas-ofertas-b7e7c.firebaseapp.com",
          projectId: "minhas-ofertas-b7e7c",
          storageBucket: "minhas-ofertas-b7e7c.firebasestorage.app",
          messagingSenderId: "99097601702",
          appId: "1:99097601702:web:2823b813ad536b170b7667",
          measurementId: "G-RQX64PZ4EY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app);

        let usuarioAtualAdmin = false;
        let eventoInstalacaoPWA = null;

        // Função profissional para exibir avisos elegantes na tela
        window.mostrarAviso = function(mensagem, corBorda = "#10b981") {
            const toast = document.getElementById('toast-aviso');
            toast.innerText = mensagem;
            toast.style.borderLeftColor = corBorda;
            toast.classList.add('mostrar');
            setTimeout(() => {
                toast.classList.remove('mostrar');
            }, 3500);
        }

        // Função de Confirmação customizada (substitui o confirm do navegador)
        let funcaoCallbackConfirmar = null;
        window.abrirModalConfirmacao = function(texto, callback) {
            document.getElementById('modal-texto-pergunta').innerText = texto;
            document.getElementById('modal-confirmacao').style.display = 'flex';
            funcaoCallbackConfirmar = callback;
        }

        window.fecharModalConfirmacao = function(resposta) {
            document.getElementById('modal-confirmacao').style.display = 'none';
            if (resposta && typeof funcaoCallbackConfirmar === 'function') {
                funcaoCallbackConfirmar();
            }
            funcaoCallbackConfirmar = null;
        }

        document.getElementById('btn-modal-sim-acao').addEventListener('click', () => {
            fecharModalConfirmacao(true);
        });

        // Cronômetro Regressivo de 15 minutos
        function iniciarCronometroGlobal() {
            let tempoFim = localStorage.getItem('tempoFimOferta');
            if (!tempoFim) {
                tempoFim = Date.now() + 15 * 60 * 1000;
                localStorage.setItem('tempoFimOferta', tempoFim);
            }

            setInterval(() => {
                const agora = Date.now();
                let distancia = tempoFim - agora;

                if (distancia < 0) {
                    tempoFim = Date.now() + 15 * 60 * 1000;
                    localStorage.setItem('tempoFimOferta', tempoFim);
                    distancia = tempoFim - agora;
                }

                const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
                const segundos = Math.floor((distancia % (1000 * 60)) / 1000);
                const textoFormatado = `⏱️ Expira em: ${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;
                
                document.querySelectorAll('.timer-oferta').forEach(el => {
                    el.innerText = textoFormatado;
                });
            }, 1000);
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            eventoInstalacaoPWA = e;
            setTimeout(() => {
                document.getElementById('popup-instalar').style.display = 'block';
            }, 2000);
        });

        document.getElementById('btn-instalar-app').addEventListener('click', async () => {
            if (eventoInstalacaoPWA) {
                eventoInstalacaoPWA.prompt();
                eventoInstalacaoPWA = null;
                document.getElementById('popup-instalar').style.display = 'none';
            } else {
                mostrarAviso("Abra o menu do navegador e escolha 'Adicionar à tela inicial'.", "#f59e0b");
            }
        });

        window.fecharPopupInstalar = function() {
            document.getElementById('popup-instalar').style.display = 'none';
        }

        let contadorCliquesTela = 0;
        let tempoUltimoClique = 0;

        document.addEventListener('click', function(e) {
            if (e.target.closest('#popup-notif') || e.target.closest('#popup-instalar') || e.target.closest('header')) return;

            const agora = Date.now();
            if (agora - tempoUltimoClique > 1500) {
                contadorCliquesTela = 1;
            } else {
                contadorCliquesTela++;
            }
            tempoUltimoClique = agora;

            if (contadorCliquesTela >= 3) {
                document.getElementById('popup-notif').style.display = 'block';
                contadorCliquesTela = 0;
            }
        });

        window.fecharPopupNotif = function() {
            document.getElementById('popup-notif').style.display = 'none';
        }

        window.realizarLogin = async function() {
            const email = document.getElementById('auth-email').value;
            const senha = document.getElementById('auth-senha').value;
            if (!email || !senha) { mostrarAviso("Preencha o e-mail e a senha!", "#ef4444"); return; }
            try {
                await signInWithEmailAndPassword(auth, email, senha);
                mostrarAviso("Login realizado com sucesso!");
            } catch (erro) { mostrarAviso("Erro ao entrar: Verifique os dados.", "#ef4444"); }
        }

        window.criarConta = async function() {
            const email = document.getElementById('auth-email').value;
            const senha = document.getElementById('auth-senha').value;
            if (!email || !senha) { mostrarAviso("Preencha o e-mail e uma senha!", "#ef4444"); return; }
            try {
                await createUserWithEmailAndPassword(auth, email, senha);
                mostrarAviso("Conta criada com sucesso!");
            } catch (erro) { mostrarAviso("Erro ao criar conta.", "#ef4444"); }
        }

        window.esqueciSenha = async function() {
            const email = document.getElementById('auth-email').value;
            if (!email) { mostrarAviso("Digite seu e-mail no campo acima primeiro.", "#f59e0b"); return; }
            try {
                await sendPasswordResetEmail(auth, email);
                mostrarAviso("E-mail de recuperação enviado!");
            } catch (erro) { mostrarAviso("Erro ao enviar e-mail.", "#ef4444"); }
        }

        window.fazerLogout = async function() {
            await signOut(auth);
            mostrarAviso("Você saiu da conta.");
        }

        // ⚠️ COLOQUE SEU E-MAIL DE ADMIN AQUI:
        const EMAIL_ADMIN_OFICIAL = "giliardmartins31@gmail.com";

        onAuthStateChanged(auth, (user) => {
            const blocoAuth = document.getElementById('bloco-auth-topo');
            if (user) {
                blocoAuth.innerHTML = `
                    <span style="font-size: 11px; max-width: 110px; overflow:hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);">👤 ${user.email.split('@')[0]}</span>
                    <button class="btn-sair-topo" onclick="fazerLogout()">Sair</button>
                `;
                usuarioAtualAdmin = (user.email === EMAIL_ADMIN_OFICIAL);
                if (usuarioAtualAdmin) {
                    document.getElementById('painel-admin').classList.remove('escondido');
                    document.getElementById('info-admin').innerText = "Logado como Admin: " + user.email;
                } else {
                    document.getElementById('painel-admin').classList.add('escondido');
                }
                carregarProdutos();
            } else {
                usuarioAtualAdmin = false;
                blocoAuth.innerHTML = `
                    <input type="email" id="auth-email" placeholder="E-mail">
                    <input type="password" id="auth-senha" placeholder="Senha">
                    <button id="btn-acao-auth" onclick="realizarLogin()">Entrar</button>
                    <button style="background: #0284c7;" onclick="criarConta()">Cadastrar</button>
                    <span class="link-topo" onclick="esqueciSenha()">Esqueci</span>
                `;
                document.getElementById('painel-admin').classList.add('escondido');
                carregarProdutos();
            }
        });

        async function carregarProdutos() {
            const container = document.getElementById('lista-produtos');
            try {
                const querySnapshot = await getDocs(collection(db, "produtos"));
                if (querySnapshot.empty) {
                    container.innerHTML = '<div class="card" style="text-align: center;"><p>Nenhuma oferta cadastrada ainda.</p></div>';
                    return;
                }

                let htmlProdutos = '';
                querySnapshot.forEach((docSnap) => {
                    const prod = docSnap.data();
                    let botaoApagarHTML = usuarioAtualAdmin ? `<button class="btn-apagar" onclick="pedirConfirmacaoApagar('${docSnap.id}')">🗑️ Apagar Anúncio</button>` : '';

                    htmlProdutos += `
                        <div class="card produto-card">
                            <img src="${prod.imagem}" alt="Produto">
                            <div class="produto-titulo">${prod.titulo}</div>
                            <div class="timer-oferta">⏱️ Expira em: 15:00</div>
                            <div class="produto-preco">R$ ${prod.preco}</div>
                            <p>${prod.descricao || 'Garanta já o seu!'}</p>
                            <button class="btn-principal" onclick="clicarProduto('${docSnap.id}', '${prod.linkAfiliado}')">🔥 Ver Oferta na Loja</button>
                            ${botaoApagarHTML}
                        </div>
                    `;
                });
                container.innerHTML = htmlProdutos;
                iniciarCronometroGlobal();
            } catch (erro) {
                console.error("Erro ao carregar produtos:", erro);
            }
        }

        window.pedirConfirmacaoApagar = function(idProduto) {
            abrirModalConfirmacao("Deseja realmente apagar este anúncio?", async () => {
                try {
                    await deleteDoc(doc(db, "produtos", idProduto));
                    mostrarAviso("Produto apagado com sucesso!");
                    carregarProdutos();
                } catch (erro) { mostrarAviso("Erro ao apagar produto.", "#ef4444"); }
            });
        }

        async function carregarCliques() {
            try {
                const docRef = doc(db, "estatisticas", "cliquesOfertas");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    document.getElementById('contador-cliques').innerText = docSnap.data().total || 0;
                }
            } catch (erro) { console.error("Erro cliques:", erro); }
        }

        carregarProdutos();
        carregarCliques();

        window.cadastrarComFoto = async function() {
            const fileInput = document.getElementById('input-arquivo');
            const titulo = document.getElementById('input-titulo').value;
            const preco = document.getElementById('input-preco').value;
            const link = document.getElementById('input-link').value;

            if (fileInput.files.length === 0 || !titulo || !preco || !link) {
                mostrarAviso("Selecione uma foto e preencha todos os campos!", "#f59e0b");
                return;
            }

            const arquivo = fileInput.files[0];
            const nomeArquivo = 'produtos/' + Date.now() + '_' + arquivo.name;
            const storageRef = ref(storage, nomeArquivo);

            try {
                mostrarAviso("Publicando produto na vitrine...", "#2563eb");
                const snapshot = await uploadBytes(storageRef, arquivo);
                const urlImagem = await getDownloadURL(snapshot.ref);

                const novoProduto = {
                    titulo: titulo,
                    preco: preco,
                    descricao: "Oferta imperdível selecionada para você.",
                    imagem: urlImagem,
                    linkAfiliado: link,
                    criadoEm: new Date().toISOString()
                };

                await addDoc(collection(db, "produtos"), novoProduto);
                mostrarAviso("Produto publicado com sucesso!");
                fileInput.value = '';
                document.getElementById('input-titulo').value = '';
                document.getElementById('input-preco').value = '';
                document.getElementById('input-link').value = '';
                carregarProdutos();
            } catch (erro) { mostrarAviso("Erro ao enviar produto.", "#ef4444"); }
        }

        window.clicarProduto = async function(idProduto, linkAfiliado) {
            try {
                const docRef = doc(db, "estatisticas", "cliquesOfertas");
                await updateDoc(docRef, { total: increment(1) });
                carregarCliques();
            } catch (e) {}
            window.open(linkAfiliado, '_blank');
        }

        window.ativarNotificacoes = function() {
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    mostrarAviso("Notificações ativadas com sucesso!");
                } else {
                    mostrarAviso("Permissão de notificação negada.", "#f59e0b");
                }
            });
        }
    </script>
</body>
</html>
