<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Ofertas - Achadinhos</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f3f4f6; color: #333; }
        header { background: #2563eb; color: white; padding: 20px; text-align: center; }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .produto-card { text-align: left; }
        .produto-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .produto-titulo { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .produto-preco { color: #16a34a; font-size: 20px; font-weight: bold; margin-bottom: 12px; }
        input[type="text"] { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
        button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 5px; }
        button:hover { background: #1d4ed8; }
        .btn-secundario { background: #10b981; }
        .btn-secundario:hover { background: #059669; }
        .stats { font-size: 14px; color: #666; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h2>🔥 Super Ofertas & Achadinhos</h2>
        <p>Sua vitrine de promoções em tempo real</p>
    </header>

    <div class="container">
        <!-- Painel de Cadastro Perfeito -->
        <div class="card">
            <h3>Cadastrar Achadinho 🚀</h3>
            <p>Insira os dados reais do produto:</p>
            <input type="text" id="input-titulo" placeholder="Nome do produto (ex: Óculos de Sol Esportivo)">
            <input type="text" id="input-preco" placeholder="Preço (ex: 39,90)">
            <input type="text" id="input-imagem" placeholder="Link da foto (clique com botão direito na foto do produto e copie o link da imagem)">
            <input type="text" id="input-link" placeholder="Seu link de afiliado (Shopee/Mercado Livre)">
            <button class="btn-secundario" onclick="cadastrarProduto()">✨ Publicar na Vitrine</button>
        </div>

        <!-- Vitrine de Produtos -->
        <div id="lista-produtos">
            <p style="text-align: center; color: #666;">Carregando ofertas...</p>
        </div>

        <div class="card stats">
            Cliques totais no app: <span id="contador-cliques">0</span>
        </div>
    </div>

    <!-- Script do Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC75L1-BhKHuwAf21o2ORV6UMHK0JVvcmQ",
          authDomain: "minhas-ofertas-b7e7c.firebaseapp.com",
          projectId: "minhas-ofertas-b7e7c",
          storageBucket: "minhas-ofertas-b7e7c.firebasestorage.app",
          messagingSenderId: "99097601702",
          appId: "1:99097601702:web:2823b813ad536b170b7667",
          measurementId: "G-RQX64PZ4EY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function carregarProdutos() {
            const container = document.getElementById('lista-produtos');
            try {
                const querySnapshot = await getDocs(collection(db, "produtos"));
                if (querySnapshot.empty) {
                    container.innerHTML = '<div class="card" style="text-align: center;"><p>Nenhuma oferta cadastrada ainda.</p></div>';
                    return;
                }

                let htmlProdutos = '';
                querySnapshot.forEach((docSnap) => {
                    const prod = docSnap.data();
                    htmlProdutos += `
                        <div class="card produto-card">
                            <img src="${prod.imagem}" alt="Produto">
                            <div class="produto-titulo">${prod.titulo}</div>
                            <div class="produto-preco">R$ ${prod.preco}</div>
                            <p>${prod.descricao || 'Garanta já o seu com frete rápido!'}</p>
                            <button onclick="clicarProduto('${docSnap.id}', '${prod.linkAfiliado}')">🔥 Ver Oferta na Loja</button>
                        </div>
                    `;
                });
                container.innerHTML = htmlProdutos;
            } catch (erro) {
                console.error("Erro ao carregar produtos:", erro);
            }
        }

        async function carregarCliques() {
            try {
                const docRef = doc(db, "estatisticas", "cliquesOfertas");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    document.getElementById('contador-cliques').innerText = docSnap.data().total || 0;
                }
            } catch (erro) {
                console.error("Erro ao carregar cliques:", erro);
            }
        }

        carregarProdutos();
        carregarCliques();

        window.cadastrarProduto = async function() {
            const titulo = document.getElementById('input-titulo').value;
            const preco = document.getElementById('input-preco').value;
            const imagem = document.getElementById('input-imagem').value;
            const link = document.getElementById('input-link').value;

            if (!titulo || !preco || !imagem || !link) {
                alert("Por favor, preencha todos os campos para a oferta ficar perfeita!");
                return;
            }

            try {
                const novoProduto = {
                    titulo: titulo,
                    preco: preco,
                    descricao: "Achadinho selecionado especialmente para você.",
                    imagem: imagem,
                    linkAfiliado: link,
                    criadoEm: new Date().toISOString()
                };

                await addDoc(collection(db, "produtos"), novoProduto);
                
                alert("Oferta publicada com sucesso na sua vitrine!");
                document.getElementById('input-titulo').value = '';
                document.getElementById('input-preco').value = '';
                document.getElementById('input-imagem').value = '';
                document.getElementById('input-link').value = '';
                carregarProdutos();
            } catch (erro) {
                console.error("Erro ao cadastrar:", erro);
                alert("Erro ao salvar produto.");
            }
        }

        window.clicarProduto = async function(idProduto, linkAfiliado) {
            try {
                const docRef = doc(db, "estatisticas", "cliquesOfertas");
                await updateDoc(docRef, { total: increment(1) });
                carregarCliques();
                window.open(linkAfiliado, '_blank');
            } catch (erro) {
                window.open(linkAfiliado, '_blank');
            }
        }
    </script>
</body>
</html>
