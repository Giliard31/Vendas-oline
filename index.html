<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Ofertas - Achadinhos</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f3f4f6; color: #333; }
        
        /* Cabeçalho Fixo com Banner de Fundo de Alta Qualidade */
        header { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            background: linear-gradient(rgba(37, 99, 235, 0.88), rgba(29, 78, 216, 0.92)), url('https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            color: white; 
            padding: 12px 10px; 
            text-align: center; 
            z-index: 1000; 
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        
        /* Nome da página maior e super destacado */
        header h2 { 
            margin: 0 0 8px 0; 
            font-size: 20px; 
            font-weight: 900; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
            letter-spacing: 0.5px;
        }
        
        /* Área de Login/Cadastro Maior e Lado a Lado */
        .header-auth {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .header-auth input {
            padding: 6px 9px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 115px;
            background: #ffffff;
        }
        .header-auth button {
            padding: 6px 11px;
            font-size: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .header-auth button:hover { background: #059669; }
        .btn-sair-topo { background: #dc2626 !important; }
        .btn-sair-topo:hover { background: #b91c1c !important; }
        
        .link-topo { color: #f3f4f6; font-size: 11px; text-decoration: underline; cursor: pointer; margin-left: 4px; font-weight: bold; }

        /* Espaçamento adaptado para o topo fixo maior */
        .container { padding: 105px 15px 20px 15px; max-width: 600px; margin: auto; }

        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .produto-card { text-align: left; }
        .produto-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .produto-titulo { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .produto-preco { color: #16a34a; font-size: 20px; font-weight: bold; margin-bottom: 12px; }
        
        input[type="text"], input[type="file"] { 
            width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; font-size: 14px; background: #fff; 
        }
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-bottom: 5px; }
        
        button.btn-principal { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 5px; }
        button.btn-principal:hover { background: #1d4ed8; }
        .btn-apagar { background: #dc2626; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-apagar:hover { background: #b91c1c; }
        
        /* Popup Flutuante de Notificação (Ativado por 3 cliques) */
        #popup-notif {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 2000;
            display: none;
            max-width: 90%;
            text-align: center;
            border: 2px solid #38bdf8;
        }
        #popup-notif button {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 13px;
        }

        .stats { font-size: 14px; color: #666; margin-top: 10px; text-align: center; }
        .escondido { display: none; }
    </style>
</head>
<body>

    <div id="popup-notif">
        <p style="margin: 0; font-size: 13px; font-weight: bold;">🔔 Deseja ativar os alertas para receber achadinhos no celular?</p>
        <button onclick="ativarNotificacoes(); fecharPopupNotif();">Sim, Ativar Agora!</button>
        <span style="display:block; margin-top:6px; font-size:11px; text-decoration:underline; cursor:pointer; opacity:0.8;" onclick="fecharPopupNotif()">Fechar</span>
    </div>

    <header>
        <h2>🔥 SUPER OFERTAS & ACHADINHOS</h2>
        
        <div class="header-auth" id="bloco-auth-topo">
            <input type="email" id="auth-email" placeholder="E-mail">
            <input type="password" id="auth-senha" placeholder="Senha">
            <button id="btn-acao-auth" onclick="realizarLogin()">Entrar</button>
            <button style="background: #0284c7;" onclick="criarConta()">Cadastrar</button>
            <span class="link-topo" onclick="esqueciSenha()">Esqueci</span>
        </div>
    </header>

    <div class="container">
        
        <div id="painel-admin" class="card escondido" style="border: 2px dashed #2563eb;">
            <h3 style="color: #2563eb; margin-top: 0;">🔒 Painel do Administrador</h3>
            <p id="info-admin" style="font-size: 12px; color: #666;"></p>
            
            <label>Selecione a foto do produto:</label>
            <input type="file" id="input-arquivo" accept="image/*">

            <label>Nome do produto:</label>
            <input type="text" id="input-titulo" placeholder="Ex: Óculos de Sol Esportivo">

            <label>Preço:</label>
            <input type="text" id="input-preco" placeholder="Ex: 39,90">

            <label>Link de afiliado:</label>
            <input type="text" id="input-link" placeholder="Cole o link da Shopee ou Mercado Livre">

            <button class="btn-principal" style="background: #10b981;" onclick="cadastrarComFoto()">✨ Publicar na Vitrine</button>
        </div>

        <div id="lista-produtos">
            <p style="text-align: center; color: #666;">Carregando ofertas...</p>
        </div>

        <div class="card stats">
            Cliques totais no app: <span id="contador-cliques">0</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, updateDoc, deleteDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC75L1-BhKHuwAf21o2ORV6UMHK0JVvcmQ",
          authDomain: "minhas-ofertas-b7e7c.firebaseapp.com",
          projectId: "minhas-ofertas-b7e7c",
          storageBucket: "minhas-ofertas-b7e7c.firebasestorage.app",
          messagingSenderId: "99097601702",
          appId: "1:99097601702:web:2823b813ad536b170b7667",
          measurementId: "G-RQX64PZ4EY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app);

        let usuarioAtualAdmin = false;

        // Gatilho secreto de 3 cliques na tela para exibir o pop-up de notificações
        let contadorCliquesTela = 0;
        let tempoUltimoClique = 0;

        document.addEventListener('click', function(e) {
            // Ignora se o clique for dentro do pop-up ou do cabeçalho de login para não atrapalhar
            if (e.target.closest('#popup-notif') || e.target.closest('header')) return;

            const agora = Date.now();
            if (agora - tempoUltimoClique > 1500) {
                contadorCliquesTela = 1;
            } else {
                contadorCliquesTela++;
            }
            tempoUltimoClique = agora;

            if (contadorCliquesTela >= 3) {
                document.getElementById('popup-notif').style.display = 'block';
                contadorCliquesTela = 0;
            }
        });

        window.fecharPopupNotif = function() {
            document.getElementById('popup-notif').style.display = 'none';
        }

        window.realizarLogin = async function() {
            const email = document.getElementById('auth-email').value;
            const senha = document.getElementById('auth-senha').value;

            if (!email || !senha) {
                alert("Digite o e-mail e a senha para entrar!");
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, senha);
                alert("Login realizado com sucesso!");
            } catch (erro) {
                alert("Erro ao entrar: " + erro.message);
            }
        }

        window.criarConta = async function() {
            const email = document.getElementById('auth-email').value;
            const senha = document.getElementById('auth-senha').value;

            if (!email || !senha) {
                alert("Digite o e-mail e uma senha nos campos acima para criar sua conta!");
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, senha);
                alert("Conta criada e logada com sucesso!");
            } catch (erro) {
                alert("Erro ao criar conta: " + erro.message);
            }
        }

        window.esqueciSenha = async function() {
            const email = document.getElementById('auth-email').value;
            if (!email) {
                alert("Digite o seu e-mail no campo de e-mail lá em cima primeiro.");
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                alert("E-mail de recuperação enviado! Verifique sua caixa de entrada e spam.");
            } catch (erro) {
                alert("Erro: " + erro.message);
            }
        }

        window.fazerLogout = async function() {
            await signOut(auth);
            alert("Você saiu da conta.");
        }

        // ⚠️ LEMBRE-SE DE COLOCAR O SEU E-MAIL EXATO DE ADMIN AQUI:
        const EMAIL_ADMIN_OFICIAL = "giliardmartins31@gmail.com";

        onAuthStateChanged(auth, (user) => {
            const blocoAuth = document.getElementById('bloco-auth-topo');
            
            if (user) {
                // Usuário logado: Muda o botão de entrar para botão de Sair vermelho
                blocoAuth.innerHTML = `
                    <span style="font-size: 11px; max-width: 110px; overflow:hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold;">👤 ${user.email.split('@')[0]}</span>
                    <button class="btn-sair-topo" onclick="fazerLogout()">Sair</button>
                `;

                if (user.email === EMAIL_ADMIN_OFICIAL) {
                    usuarioAtualAdmin = true;
                    document.getElementById('painel-admin').classList.remove('escondido');
                    document.getElementById('info-admin').innerText = "Logado como Admin: " + user.email;
                } else {
                    usuarioAtualAdmin = false;
                    document.getElementById('painel-admin').classList.add('escondido');
                }
                carregarProdutos();
            } else {
                // Ninguém logado: Restaura os inputs de login e cadastro maiores e organizados
                usuarioAtualAdmin = false;
                blocoAuth.innerHTML = `
                    <input type="email" id="auth-email" placeholder="E-mail">
                    <input type="password" id="auth-senha" placeholder="Senha">
                    <button id="btn-acao-auth" onclick="realizarLogin()">Entrar</button>
                    <button style="background: #0284c7;" onclick="criarConta()">Cadastrar</button>
                    <span class="link-topo" onclick="esqueciSenha()">Esqueci</span>
                `;
                document.getElementById('painel-admin').classList.add('escondido');
                carregarProdutos();
            }
        });

        async function carregarProdutos() {
            const container = document.getElementById('lista-produtos');
            try {
                const querySnapshot = await getDocs(collection(db, "produtos"));
                if (querySnapshot.empty) {
                    container.innerHTML = '<div class="card" style="text-align: center;"><p>Nenhuma oferta cadastrada ainda.</p></div>';
                    return;
                }

                let htmlProdutos = '';
                querySnapshot.forEach((docSnap) => {
                    const prod = docSnap.data();
                    
                    let botaoApagarHTML = '';
                    if (usuarioAtualAdmin) {
                        botaoApagarHTML = `<button class="btn-apagar" onclick="apagarProduto('${docSnap.id}')">🗑️ Apagar Anúncio</button>`;
                    }

                    htmlProdutos += `
                        <div class="card produto-card">
                            <img src="${prod.imagem}" alt="Produto">
                            <div class="produto-titulo">${prod.titulo}</div>
                            <div class="produto-preco">R$ ${prod.preco}</div>
                            <p>${prod.descricao || 'Garanta já o seu!'}</p>
                            <button class="btn-principal" onclick="clicarProduto('${docSnap.id}', '${prod.linkAfiliado}')">🔥 Ver Oferta na Loja</button>
                            ${botaoApagarHTML}
                        </div>
                    `;
                });
                container.innerHTML = htmlProdutos;
            } catch (erro) {
                console.error("Erro ao carregar produtos:", erro);
            }
        }

        window.apagarProduto = async function(idProduto) {
            if (confirm("Tem certeza que deseja apagar este anúncio da vitrine?")) {
                try {
                    await deleteDoc(doc(db, "produtos", idProduto));
                    alert("Produto apagado com sucesso!");
                    carregarProdutos();
                } catch (erro) {
                    console.error("Erro ao apagar:", erro);
                    alert("Erro ao tentar apagar o produto.");
                }
            }
        }

        async function carregarCliques() {
            try {
                const docRef = doc(db, "estatisticas", "cliquesOfertas");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    document.getElementById('contador-cliques').innerText = docSnap.data().total || 0;
                }
            } catch (erro) {
                console.error("Erro ao carregar cliques:", erro);
            }
        }

        carregarProdutos();
        carregarCliques();

        window.cadastrarComFoto = async function() {
            const fileInput = document.getElementById('input-arquivo');
            const titulo = document.getElementById('input-titulo').value;
            const preco = document.getElementById('input-preco').value;
            const link = document.getElementById('input-link').value;

            if (fileInput.files.length === 0 || !titulo || !preco || !link) {
                alert("Por favor, selecione uma foto e preencha todos os campos!");
                return;
            }

            const arquivo = fileInput.files[0];
            const nomeArquivo = 'produtos/' + Date.now() + '_' + arquivo.name;
            const storageRef = ref(storage, nomeArquivo);

            try {
                alert("Enviando produto para a vitrine...");
                const snapshot = await uploadBytes(storageRef, arquivo);
                const urlImagem = await getDownloadURL(snapshot.ref);

                const novoProduto = {
                    titulo: titulo,
                    preco: preco,
                    descricao: "Oferta imperdível selecionada para você.",
                    imagem: urlImagem,
                    linkAfiliado: link,
                    criadoEm: new Date().toISOString()
                };

                await addDoc(collection(db, "produtos"), novoProduto);
                
                alert("Produto publicado com sucesso!");
                fileInput.value = '';
                document.getElementById('input-titulo').value = '';
                document.getElementById('input-preco').value = '';
                document.getElementById('input-link').value = '';
                carregarProdutos();
            } catch (erro) {
                console.error("Erro ao cadastrar:", erro);
                alert("Erro ao enviar produto.");
            }
        }

        window.clicarProduto = async function(idProduto, linkAfiliado) {
            try {
                const docRef = doc(db, "estatisticas", "cliquesOfertas");
                await updateDoc(docRef, { total: increment(1) });
                carregarCliques();
                window.open(linkAfiliado, '_blank');
            } catch (erro) {
                window.open(linkAfiliado, '_blank');
            }
        }

        window.ativarNotificacoes = function() {
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    alert("Notificações ativadas com sucesso!");
                } else {
                    alert("Permissão de notificação negada.");
                }
            });
        }
    </script>
</body>
</html>
